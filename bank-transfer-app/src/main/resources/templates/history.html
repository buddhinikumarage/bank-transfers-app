<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Account History</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header class="topbar">
    <h1>Account History</h1>
    <p th:text="${holder.name + ' (' + accountNumber + ')'}">Customer (000000)</p>
</header>

<main class="container">

    <nav class="card navigation">
        <a th:href="@{/}" class="btn small">&larr; Dashboard</a>
    </nav>

    <section class="stats">
        <div class="stat">
            <span th:text="${#numbers.formatDecimal(
                holder.balance, 1, 'COMMA', 2, 'POINT')}">0.00</span>
            <small>Current balance (LKR)</small>
        </div>
        <div class="stat ok">
            <span th:text="${#numbers.formatDecimal(
                totalSent, 1, 'COMMA', 2, 'POINT')}">0.00</span>
            <small>Total sent (LKR, successful transfers)</small>
        </div>
    </section>

    <section class="card">
        <h2>Transactions</h2>

        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Date &amp; Time</th>
                    <th>From</th>
                    <th>To</th>
                    <th class="num">Amount (LKR)</th>
                    <th>Status</th>
                    <th>Description</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(transactions)}">
                    <td colspan="7" class="empty">No transactions for this account.</td>
                </tr>

                <tr th:each="t : ${transactions}">
                    <td th:text="${t.id}"></td>
                    <td th:text="${t.timestamp != null
                        ? #temporals.format(t.timestamp, 'yyyy-MM-dd HH:mm:ss')
                        : '-'}"></td>
                    <td th:text="${t.sourceAccountNumber != null
                        ? t.sourceAccountNumber : '-'}"></td>
                    <td th:text="${t.targetAccountNumber != null
                        ? t.targetAccountNumber : '-'}"></td>
                    <td class="num"
                        th:text="${#numbers.formatDecimal(
                            t.amount, 1, 'COMMA', 2, 'POINT')}"></td>
                    <td>
                        <span class="tag"
                              th:classappend="${t.status.name() == 'SUCCESS'} ? 'ok' : 'fail'"
                              th:text="${t.status}"></span>
                    </td>
                    <td th:text="${t.description}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

</main>

<footer class="footer">
    COSC 32133 / BECS 32263 &middot; Lab Sheet 06
</footer>

</body>
</html>

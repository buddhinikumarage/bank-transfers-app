<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Deposit / Withdraw</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header class="topbar">
    <h1 th:text="${title}">Deposit Money</h1>
    <p>Spring Boot &middot; @Transactional &middot; @Query &middot; MySQL</p>
</header>

<main class="container">

    <nav class="card navigation">
        <a th:href="@{/}" class="btn small">&larr; Dashboard</a>
        <a th:href="@{/deposit}" class="btn small">Deposit Money</a>
        <a th:href="@{/withdraw}" class="btn small">Withdraw Money</a>
    </nav>

    <div class="alert danger" th:if="${error}" th:text="${error}"></div>

    <section class="card">
        <h2 th:text="${title}">Deposit Money</h2>

        <form th:action="@{${action}}" method="post">

            <div class="field">
                <label for="accountNumber">Account</label>
                <select id="accountNumber" name="accountNumber" required>
                    <option value="">-- Select account --</option>
                    <option th:each="c : ${allCustomers}"
                            th:unless="${c.accountNumber == '999999'}"
                            th:value="${c.accountNumber}"
                            th:text="${c.name + ' (' + c.accountNumber + ') - LKR ' +
                                #numbers.formatDecimal(
                                    c.balance, 1, 'COMMA', 2, 'POINT')}">
                    </option>
                </select>
            </div>

            <div class="field">
                <label for="amount">Amount (LKR)</label>
                <input type="number"
                       step="0.01"
                       min="0.01"
                       id="amount"
                       name="amount"
                       placeholder="5000.00"
                       required>
            </div>

            <button type="submit" class="btn primary">Submit</button>
        </form>
    </section>

</main>

<footer class="footer">
    COSC 32133 / BECS 32263 &middot; Lab Sheet 06
</footer>

</body>
</html>

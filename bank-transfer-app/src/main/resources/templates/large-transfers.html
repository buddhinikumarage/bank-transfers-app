<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Large Transfers</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header class="topbar">
    <h1>Large Transfers</h1>
    <p>Transfers of LKR
        <span th:text="${#numbers.formatDecimal(min, 1, 'COMMA', 2, 'POINT')}">10,000.00</span>
        or more
    </p>
</header>

<main class="container">

    <nav class="card navigation">
        <a th:href="@{/}" class="btn small">&larr; Dashboard</a>
    </nav>

    <section class="card">
        <form th:action="@{/large-transfers}" method="get" class="search">
            <input type="number"
                   name="min"
                   step="0.01"
                   min="0"
                   th:value="${min}"
                   placeholder="Minimum amount">
            <button type="submit" class="btn small">Filter</button>
        </form>

        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Date &amp; Time</th>
                    <th>From</th>
                    <th>To</th>
                    <th class="num">Amount (LKR)</th>
                    <th>Status</th>
                    <th>Description</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(transfers)}">
                    <td colspan="7" class="empty">No transfers found.</td>
                </tr>

                <tr th:each="t : ${transfers}">
                    <td th:text="${t.id}"></td>
                    <td th:text="${t.timestamp != null
                        ? #temporals.format(t.timestamp, 'yyyy-MM-dd HH:mm:ss')
                        : '-'}"></td>
                    <td th:text="${t.sourceAccountNumber}"></td>
                    <td th:text="${t.targetAccountNumber}"></td>
                    <td class="num"
                        th:text="${#numbers.formatDecimal(
                            t.amount, 1, 'COMMA', 2, 'POINT')}"></td>
                    <td>
                        <span class="tag"
                              th:classappend="${t.status.name() == 'SUCCESS'} ? 'ok' : 'fail'"
                              th:text="${t.status}"></span>
                    </td>
                    <td th:text="${t.description}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

</main>

<footer class="footer">
    COSC 32133 / BECS 32263 &middot; Lab Sheet 06
</footer>

</body>
</html>
